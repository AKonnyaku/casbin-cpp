name: Performance Comparison for Pull Requests

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-pr:
    name: Performance benchmark comparison
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git python3 jq wget

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Save commit info
        id: commits
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "base_short=$(echo $BASE_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "head_short=$(echo $HEAD_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          
          # We need to mark the directory as safe because we are mounting it? 
          # Or just configuring git since we might be in a container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pre-fetch dependencies
        run: |
          # json
          wget https://github.com/nlohmann/json/archive/refs/tags/v3.11.2.tar.gz -O json.tar.gz
          mkdir -p json-src
          tar -xzf json.tar.gz -C json-src --strip-components=1
          echo "JSON_SRC=$(pwd)/json-src" >> $GITHUB_ENV
          
          # googletest
           wget https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz -O gtest.tar.gz
           mkdir -p gtest-src
           tar -xzf gtest.tar.gz -C gtest-src --strip-components=1
           echo "GTEST_SRC=$(pwd)/gtest-src" >> $GITHUB_ENV
           
           # benchmark
           wget https://github.com/google/benchmark/archive/refs/tags/v1.8.3.tar.gz -O bench.tar.gz
           mkdir -p bench-src
           tar -xzf bench.tar.gz -C bench-src --strip-components=1
           echo "BENCH_SRC=$(pwd)/bench-src" >> $GITHUB_ENV

      - name: Build and Run benchmark on PR branch
        run: |
          cmake -B build-pr -S . \
            -DCASBIN_BUILD_BENCHMARK=ON \
            -DCASBIN_BUILD_TEST=ON \
            -DCASBIN_BUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_JSON=$JSON_SRC \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=$GTEST_SRC \
            -DFETCHCONTENT_SOURCE_DIR_BENCHMARK=$BENCH_SRC
          
          cmake --build build-pr --target casbin_benchmark -j$(nproc)
          
          ./build-pr/tests/benchmarks/casbin_benchmark --benchmark_format=json > pr-bench.json

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build and Run benchmark on base branch
        run: |
          cd base
          cmake -B build-base -S . \
            -DCASBIN_BUILD_BENCHMARK=ON \
            -DCASBIN_BUILD_TEST=ON \
            -DCASBIN_BUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_JSON=$JSON_SRC \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=$GTEST_SRC \
            -DFETCHCONTENT_SOURCE_DIR_BENCHMARK=$BENCH_SRC
            
          cmake --build build-base --target casbin_benchmark -j$(nproc)
          
          ./build-base/tests/benchmarks/casbin_benchmark --benchmark_format=json > ../base-bench.json

      - name: Compare benchmarks
        id: compare
        run: |
          cat > comparison.md << 'EOF'
          ## Benchmark Comparison
          
          Comparing base branch (`${{ steps.commits.outputs.base_short }}`)
          vs PR branch (`${{ steps.commits.outputs.head_short }}`)
          
          ```
          EOF
          
          # Generate comparison table using Python
          python3 - <<'PY' >> comparison.md
          import json
          import math
          import os
          import platform
          
          def fmt_ns(ns):
              if ns < 0 or math.isnan(ns): return "-"
              if ns < 1000: return f"{ns:.2f}n"
              if ns < 1e6: return f"{ns/1e3:.2f}µ"
              if ns < 1e9: return f"{ns/1e6:.2f}m"
              return f"{ns/1e9:.2f}"
          
          def load_results(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      return {b["name"]: b for b in data.get("benchmarks", [])}
              except: return {}
          
          base = load_results("base-bench.json")
          pr = load_results("pr-bench.json")
          all_keys = sorted(list(set(base.keys()) | set(pr.keys())))
          
          # Header info
          print(f"goos: {platform.system().lower()}")
          print(f"goarch: {platform.machine().lower()}")
          print(f"pkg: casbin-cpp")
          # cpu info is hard to get reliably cross-platform in python without deps, using simple placeholder or env if available
          # In GHA runner it's usually standard.
          print(f"cpu: Unknown CPU") 
          
          print(f"{'':<50} │ {'base-bench.json':^19} │ {'pr-bench.json':^27} │")
          print(f"{'':<50} │ {'sec/op':^19} │ {'sec/op':^10} {'vs base':^16} │   Delta")

          base_vals = []
          pr_vals = []

          for k in all_keys:
              b_item = base.get(k)
              p_item = pr.get(k)
              b_val = b_item.get("cpu_time", 0.0) if b_item else 0.0
              p_val = p_item.get("cpu_time", 0.0) if p_item else 0.0
              
              if b_val > 0: base_vals.append(b_val)
              if p_val > 0: pr_vals.append(p_val)
              
              if b_val > 0:
                  diff = (p_val - b_val) / b_val
                  diff_str = f"{diff:+.2%}"
                  if diff < -0.10: status = "🚀"
                  elif diff > 0.10: status = "🐌"
                  else: status = "➡️"
              else:
                  diff_str = "-"
                  status = ""
              
              b_str = (fmt_ns(b_val) + " ± ∞ ¹") if b_val else "-"
              p_str = (fmt_ns(p_val) + " ± ∞ ¹") if p_val else "-"
              
              stats = "~ (p=1.000 n=1) ²"
              
              if b_val > 0 and p_val > 0:
                   print(f"{k:<50}   {b_str:>19}   {p_str:>19}   {stats}   {diff_str:>9} {status}")
              else:
                   print(f"{k:<50}   {b_str:>19}   {p_str:>19}   {'':<19}   {diff_str:>9} {status}")

          def get_geomean(vals):
              if not vals: return 0.0
              return math.exp(sum(math.log(x) for x in vals) / len(vals))

          g_base = get_geomean(base_vals)
          g_pr = get_geomean(pr_vals)
          
          g_diff_str = "-"
          g_status = ""
          if g_base > 0 and g_pr > 0:
              diff = (g_pr - g_base) / g_base
              g_diff_str = f"{diff:+.2%}"
              if diff < -0.10: g_status = "🚀"
              elif diff > 0.10: g_status = "🐌"
              else: g_status = "➡️"
          
          g_b_str = fmt_ns(g_base) if g_base > 0 else "-"
          g_p_str = fmt_ns(g_pr) if g_pr > 0 else "-"
          
          print(f"{'geomean':<50}   {g_b_str:>19}   {g_p_str:>19}   {'':<19}   {g_diff_str:>9} {g_status}")
          print("¹ need >= 6 samples for confidence interval at level 0.95")
          print("² need >= 4 samples to detect a difference at alpha level 0.05")
          PY
          
          echo '```' >> comparison.md

      - name: Save PR number
        run: echo ${{ github.event.number }} > pr_number.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            comparison.md
            pr_number.txt
